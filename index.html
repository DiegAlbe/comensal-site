<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMENSAL — Nutrición, Oficio y Memoria</title>
  
  <!-- Google Fonts: Playfair Display (Serif) e Inter (Sans-serif) -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 para íconos minimalistas -->
  <link rel="stylesheet" href="https://cloudflare.com">

  <style>
    /* ==========================================================================
       VARIABLES Y RESET
       ========================================================================== */
    :root {
      --bg-crema: #F9F6F0;
      --txt-principal: #1A1A1A;
      --txt-secundario: #2C2C2C;
      --bg-bloque-inbound: #EBE7DE;
      --lineas: #CCCCCC;
      
      --fuente-serif: 'Playfair Display', Georgia, serif;
      --fuente-sans: 'Inter', Helvetica, sans-serif;
      --max-width-editorial: 680px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-crema);
      color: var(--txt-principal);
      font-family: var(--fuente-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       COMPONENTES GLOBALES Y BOTONES
       ========================================================================== */
    h1, h2, h3, h4 {
      font-family: var(--fuente-serif);
      font-weight: 600;
    }

    h1 em, h2 em, h3 em {
      font-style: italic;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Sistema de botones con intencionalidad clara */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      font-family: var(--fuente-sans);
      font-size: 0.95rem;
      font-weight: 500;
      border: 1px solid var(--txt-principal);
      cursor: pointer;
      transition: all 0.25s ease;
      background: transparent;
      color: var(--txt-principal);
    }

    /* Botón Email: Estilo Sólido Oscuro */
    .btn-email {
      background-color: var(--txt-principal);
      color: var(--bg-crema);
    }
    
    .btn-email:hover {
      background-color: #333333;
      transform: translateY(-2px);
    }

    /* Botón WhatsApp: Estilo Outline Limpio */
    .btn-wa {
      background-color: transparent;
      color: var(--txt-principal);
    }

    .btn-wa:hover {
      background-color: var(--txt-principal);
      color: var(--bg-crema);
      transform: translateY(-2px);
    }

    /* ==========================================================================
       NAVEGACIÓN (RESPONSIVE)
       ========================================================================== */
    .header-nav {
      position: sticky;
      top: 0;
      background-color: rgba(249, 246, 240, 0.95);
      border-bottom: 1px solid var(--lineas);
      z-index: 900;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .logo {
      font-family: var(--fuente-serif);
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--txt-principal);
    }

    .nav-menu {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-link {
      font-size: 0.9rem;
      font-weight: 500;
      position: relative;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      width: 100%;
      transform: scaleX(0);
      height: 1px;
      bottom: -4px;
      left: 0;
      background-color: var(--txt-principal);
      transform-origin: bottom right;
      transition: transform 0.25s ease-out;
    }

    .nav-link:hover::after {
      transform: scaleX(1);
      transform-origin: bottom left;
    }

    /* ==========================================================================
       SECCIÓN 1: HERO
       ========================================================================== */
    .hero-section {
      padding: 100px 0 80px 0;
      text-align: center;
      border-bottom: 1px solid var(--lineas);
    }

    .hero-content {
      max-width: 800px;
      margin: 0 auto;
    }

    .hero-title {
      font-size: 3rem;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: var(--txt-secundario);
      max-width: 600px;
      margin: 0 auto 40px auto;
    }

    .hero-svg-container {
      margin-top: 50px;
    }

    .hero-svg-container svg {
      stroke: var(--txt-principal);
    }

    /* ==========================================================================
       SECCIÓN 2: DUAL (EL NEXO DE BIFURCACIÓN)
       ========================================================================== */
    .dual-section {
      padding: 80px 0;
      border-bottom: 1px solid var(--lineas);
    }

    .section-title {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 48px;
    }

    .dual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .dual-card {
      border: 1px solid var(--txt-principal);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: transparent;
    }

    .card-icon {
      font-size: 2rem;
      margin-bottom: 24px;
      color: var(--txt-secundario);
    }

    .dual-card h3 {
      font-size: 1.6rem;
      margin-bottom: 16px;
    }

    .dual-card p {
      font-size: 1rem;
      color: var(--txt-secundario);
      margin-bottom: 32px;
      flex-grow: 1;
    }

    /* ==========================================================================
       SECCIÓN 3: VERTICAL A (INSTITUCIONAL / COMUNIDAD)
       ========================================================================== */
    .vertical-a-section {
      padding: 80px 0;
      border-bottom: 1px solid var(--lineas);
    }

    .vertical-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: start;
    }

    .badge-ley {
      display: inline-block;
      border: 1px solid var(--txt-principal);
      padding: 6px 12px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .vertical-content h2 {
      font-size: 2.2rem;
      margin-bottom: 24px;
    }

    .program-box {
      margin-top: 32px;
      padding-left: 20px;
      border-left: 2px solid var(--txt-principal);
    }

    .program-box h4 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .program-box p {
      color: var(--txt-secundario);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* Estilos de Formulario */
    .form-box {
      border: 1px solid var(--txt-principal);
      padding: 40px;
    }

    .form-box h3 {
      font-size: 1.4rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--lineas);
      background-color: transparent;
      color: var(--txt-principal);
      font-family: var(--fuente-sans);
      font-size: 0.95rem;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--txt-principal);
    }

    .form-message {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #2e7d32;
      color: #2e7d32;
      font-size: 0.9rem;
      display: none;
    }

    /* ==========================================================================
       SECCIÓN 4: VERTICAL B (CLÍNICA INDIVIDUAL)
       ========================================================================== */
    .vertical-b-section {
      padding: 100px 0;
      border-bottom: 1px solid var(--lineas);
      text-align: center;
    }

    .clinica-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .vertical-b-section h2 {
      font-size: 2.5rem;
      line-height: 1.3;
      margin-bottom: 40px;
    }

    .points-list {
      display: flex;
      justify-content: center;
      gap: 40px;
      list-style: none;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }

    .point-item {
      font-family: var(--fuente-serif);
      font-size: 1.3rem;
      font-style: italic;
      position: relative;
    }

    .point-item::after {
      content: '•';
      position: absolute;
      right: -24px;
      color: var(--lineas);
    }

    .point-item:last-child::after {
      content: '';
    }

    /* ==========================================================================
       SECCIÓN 5: BITÁCORA (BLOG EDITORIAL MODO TOGGLE)
       ========================================================================== */
    .bitacora-section {
      padding: 80px 0;
      border-bottom: 1px solid var(--lineas);
    }

    .blog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 40px;
    }

    .blog-card {
